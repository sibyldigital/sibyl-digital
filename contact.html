<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Sibyl Digital</title>
  <meta name="description" content="Get in touch with Zan Dean at Sibyl Digital. Based in Asheville, North Carolina." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Sibyl Digital</a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
      <nav class="nav" id="nav">
        <a class="navlink" href="index.html">Home</a>
        <a class="navlink" href="about.html">About</a>
        <a class="navlink" href="portfolio.html">Portfolio</a>
        <a class="btn" href="contact.html">Let's Connect</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow">Contact</p>
        <h1>Let's work together</h1>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="contact-grid">
          <div class="contact-info">
            <p class="label" style="margin-top:0;">Email</p>
            <p><a href="mailto:sibyldigital@gmail.com">sibyldigital@gmail.com</a></p>
            <p class="label">Phone</p>
            <p><a href="tel:+17073313277">707 &middot; 331 &middot; 3277</a></p>
            <p class="label">Location</p>
            <p>Asheville, North Carolina</p>
          </div>

          <form id="contact-form">
            <div class="row">
              <div>
                <label for="first_name">First name *</label>
                <input id="first_name" name="first_name" type="text" required />
              </div>
              <div>
                <label for="last_name">Last name *</label>
                <input id="last_name" name="last_name" type="text" required />
              </div>
            </div>
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" required />
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" />
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" />
            <label for="message">Message</label>
            <textarea id="message" name="message"></textarea>
            <button class="btn" type="submit">Submit</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year"></span> Sibyl Digital &middot; Zan Dean</span>
      <span><a href="mailto:sibyldigital@gmail.com">sibyldigital@gmail.com</a> &middot; Asheville, NC</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
